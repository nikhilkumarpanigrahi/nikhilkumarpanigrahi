    <text x="32" y="138" opacity="0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#58A6FF">~/nikhil<animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="3.1s" fill="freeze"/></text>
    <text x="132" y="138" opacity="0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#3FB950">$<animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="3.2s" fill="freeze"/></text>
