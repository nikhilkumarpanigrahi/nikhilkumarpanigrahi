    <text x="32" y="194" opacity="0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#58A6FF">~/nikhil<animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="4.9s" fill="freeze"/></text>
