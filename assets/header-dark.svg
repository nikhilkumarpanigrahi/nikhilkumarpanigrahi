    <text x="32" y="82" opacity="0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#58A6FF">~/nikhil<animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="0.9s" fill="freeze"/></text>
    <text x="132" y="82" opacity="0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#3FB950">$<animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="1.1s" fill="freeze"/></text>
